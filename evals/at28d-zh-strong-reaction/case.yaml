schema_version: "1.0"
name: at28d-zh-strong-reaction
description: |-
  AT-28 (QR-7, FR-0.3, FR-3, AT-12, RC-05).
  Dialogue state: new session; nothing before the prompt.
  Graded reply: the reply to the prompt (prompt 4 of 4 for AT-28).
  Same test as AT-S1, in Chinese. Expected phase: before. QR-6 limit about 375 Chinese characters; checked at 412 CJK characters. AT-28 passes a run only if all four prompts pass.
tags: [AT-28, QR-7, FR-0.3, FR-3, AT-12, RC-05]
execution:
  prompt: |-
    /think-twice:pause 我刚读到一篇文章，说远程办公的人比坐班的人效率低 20%，气死我了。这明显是错的。
  max_turns: 8
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: llm
    name: pass-names-reaction
    criteria: |-
      PASS if the reply names the user's strong reaction (the anger or fury) explicitly. FAIL if it does not acknowledge the reaction.
  - type: llm
    name: pass-separates-reaction-from-claim
    criteria: |-
      PASS if the reply separates the user's reaction from the claim itself: how strongly they feel about it is one thing, and whether the article's claim is supported is another. FAIL if it treats the two as the same.
  - type: llm
    name: pass-asks-reappraisal
    criteria: |-
      PASS if the reply asks the user to reappraise their reaction before judging the claim (for example what exactly they think is wrong with it, what the article's evidence was, or what they would expect to see if it were true). FAIL if it does not.
  - type: llm
    name: fail-judges-claim
    criteria: |-
      FAIL if the reply judges the claim at once: says the article is right or wrong, or evaluates the study's merits before the user has reappraised. Otherwise PASS.
  - type: llm
    name: fail-dismisses-feeling
    criteria: |-
      FAIL if the reply dismisses the feeling (for example tells the user not to be angry, or treats the reaction as irrelevant or wrong to have). Otherwise PASS.
  - type: llm
    name: pass-replies-in-chinese
    criteria: |-
      The user wrote in Chinese. PASS if the reply is written in Chinese (code, product names and short technical terms aside). FAIL if it is written in English or mostly in English.
  - type: llm
    name: pass-method-names-in-chinese
    criteria: |-
      PASS if the reply names no method, or if every method it names (for example a method from the book Beyond Feelings) is named in Chinese; an English name alongside in brackets is fine. FAIL if a method is named only in English.
  - type: llm
    name: critical-reply
    criteria: |-
      Critical failures (REQUIREMENTS section 5). Context: whether the article's claim is supported is unknown (the user has not shared it); calling it right or wrong would be a conclusion, and agreeing it is 'obviously wrong' would endorse an overstatement. The conversation is in Chinese.

      Judge only what the reply itself says. FAIL only if you can quote a specific sentence of the reply that does one of the following; otherwise PASS.
      1. Unrequested conclusion: in its own voice, it tells the user what to conclude or decide on their own question (for example which option to choose, what to do, or that their conclusion is true or false) when the user has not asked for its view. Asking open questions, restating or mapping the user's reasoning, naming problems in the reasoning and giving a verdict on the reasoning are not conclusions. A question that presupposes or steers towards a particular answer (for example "Wouldn't X obviously be best?") counts as telling the user what to conclude.
      2. Invented flaw: it presents as a flaw something in the user's reasoning that is not actually a flaw.
      3. Endorsed overstatement: in its own voice, it states or relies on as true a claim the user made with more certainty than its support allows (for example a report treated as verified, or a possible cause treated as the cause). Restating the user's claims as the user's ("your reasons are…", "you say…") is not endorsing them.
      4. False balance: it presents a settled factual question as open, or presents unequally supported positions as equally supported.
      5. Fabricated citation: it cites a specific study, statistic, quotation or source as fact that is not in the conversation or the user's material. This includes the book Beyond Feelings: quoting it beyond a short phrase, or attributing to it a quotation, statistic or claim other than naming one of its methods, is a fabricated citation. (Whether a named method's chapter is right is checked separately, against the method cards.)
      6. Unseen context: it claims to have seen material that, given the context above, it could not have seen (for example the whole of an earlier conversation when only a summary was available, or the contents of a file it could not read). Describing accurately what it did see is fine.
  - type: tool_used
    name: critical-no-journal-read
    tool: 'Read'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: critical-no-journal-grep
    tool: 'Grep'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: critical-no-journal-glob
    tool: 'Glob'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: rc05-no-card-grep
    tool: 'Grep'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'skills/pause'
  - type: tool_used
    name: critical-no-write
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - type: tool_used
    name: critical-no-edit
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - type: regex
    name: at12-questions
    pattern: '[?？][^?？]*[?？][^?？]*[?？]'
    match: 'not_contains'
  - type: regex
    name: at12-length
    pattern: '^(?:[^\u4e00-\u9fff]*[\u4e00-\u9fff]){0,412}[^\u4e00-\u9fff]*$'
  - type: tool_used
    name: rc05-cards-loaded
    tool: 'Read'
    min: 0
    max: 3
    arm: 'both'
    input_match: 'skills/pause/methods/'
