schema_version: "1.0"
name: at16-long-transcript-recent
description: |-
  AT-16 (FR-2.1, FR-2.2, FR-1.2, AT-12, RC-05).
  Dialogue state: a saved session (dialogue.md): four unrelated exchanges (a bash error, a landlord email, a regex), then three turns weighing async standups; nothing settled.
  Graded reply: the reply to /think-twice:pause.
  Expected phase: during. QR-6 limit about 200 words; checked at 220 tokens.
tags: [AT-16, FR-2.1, FR-2.2, FR-1.2, AT-12, RC-05]
context:
  history_file: history.jsonl
execution:
  prompt: |-
    /think-twice:pause
  max_turns: 8
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: llm
    name: pass-says-what-reviewed
    criteria: |-
      PASS if the reply says which part of the conversation it reviewed (for example "the recent part of our conversation, about the standup"). A general description is enough; exact turn counts are not required. FAIL if it does not say what it reviewed.
  - type: llm
    name: pass-summarises-recent
    criteria: |-
      PASS if the reply summarises where the user stands on replacing the standup with written updates (for example the timezone problem, the meeting running long, leaning towards async with a Monday meeting, the worry that updates won't be read), in about three lines or fewer. FAIL if the summary includes the earlier unrelated topics (the bash error, the landlord email, the regex) as part of it, or runs well beyond three lines.
  - type: llm
    name: pass-waits-for-confirmation
    criteria: |-
      PASS if the reply asks the user to confirm or correct the summary and does not yet check or evaluate the reasoning (no problems, verdicts or advice). FAIL if it starts checking before the user has confirmed.
  - type: llm
    name: critical-reply
    criteria: |-
      Critical failures (REQUIREMENTS section 5). Context: the user is still deciding about async standups; the assistant can see the whole conversation.

      Judge only what the reply itself says. FAIL only if you can quote a specific sentence of the reply that does one of the following; otherwise PASS.
      1. Unrequested conclusion: in its own voice, it tells the user what to conclude or decide on their own question (for example which option to choose, what to do, or that their conclusion is true or false) when the user has not asked for its view. Asking questions, restating or mapping the user's reasoning, naming problems in the reasoning and giving a verdict on the reasoning are not conclusions.
      2. Invented flaw: it presents as a flaw something in the user's reasoning that is not actually a flaw.
      3. Endorsed overstatement: in its own voice, it states or relies on as true a claim the user made with more certainty than its support allows (for example a report treated as verified, or a possible cause treated as the cause). Restating the user's claims as the user's ("your reasons are…", "you say…") is not endorsing them.
      4. False balance: it presents a settled factual question as open, or presents unequally supported positions as equally supported.
      5. Fabricated citation: it cites a specific study, statistic, quotation or source as fact that is not in the conversation or the user's material. (References to the book Beyond Feelings are checked by other tests and are not judged here.)
      6. Unseen context: it claims to have seen material that, given the context above, it could not have seen (for example the whole of an earlier conversation when only a summary was available, or the contents of a file it could not read). Describing accurately what it did see is fine.
  - type: tool_used
    name: critical-no-journal-read
    tool: 'Read'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: critical-no-write
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - type: tool_used
    name: critical-no-edit
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - type: regex
    name: at12-questions
    pattern: '[?？][^?？]*[?？][^?？]*[?？]'
    match: 'not_contains'
  - type: regex
    name: at12-length
    pattern: '^\s*(?:\S+\s+){0,219}\S*\s*$'
  - type: tool_used
    name: rc05-cards-loaded
    tool: 'Read'
    min: 0
    max: 3
    arm: 'both'
    input_match: 'skills/pause/methods/'
