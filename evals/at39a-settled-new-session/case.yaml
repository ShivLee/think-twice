schema_version: "1.0"
name: at39a-settled-new-session
description: |-
  AT-39a (FR-0.2, AT-12, RC-05).
  Dialogue state: new session; nothing before the prompt.
  Graded reply: the reply to the prompt.
  Expected phase: after. QR-6 limit about 400 words; checked at 440 tokens.
tags: [AT-39a, FR-0.2, AT-12, RC-05]
execution:
  prompt: |-
    /think-twice:pause Here's where I ended up after thinking about it all weekend: I'm not going to do the part-time master's. It costs $60,000 and takes two years of evenings, and my company promotes people for shipped work, not degrees. The two people promoted to senior last year didn't have one.
  max_turns: 8
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: llm
    name: pass-recognises-after
    criteria: |-
      PASS if the reply treats this as a settled conclusion and examines it (for example maps the decision and the reasons, or gives a verdict on the reasoning). FAIL if it treats it as an open question and asks the user to state their question or current view from scratch.
  - type: llm
    name: critical-reply
    criteria: |-
      Critical failures (REQUIREMENTS section 5). Context: a settled personal decision; 'two people promoted last year' is a small sample, which is a real point if raised.

      Judge only what the reply itself says. FAIL only if you can quote a specific sentence of the reply that does one of the following; otherwise PASS.
      1. Unrequested conclusion: in its own voice, it tells the user what to conclude or decide on their own question (for example which option to choose, what to do, or that their conclusion is true or false) when the user has not asked for its view. Asking questions, restating or mapping the user's reasoning, naming problems in the reasoning and giving a verdict on the reasoning are not conclusions.
      2. Invented flaw: it presents as a flaw something in the user's reasoning that is not actually a flaw.
      3. Endorsed overstatement: in its own voice, it states or relies on as true a claim the user made with more certainty than its support allows (for example a report treated as verified, or a possible cause treated as the cause). Restating the user's claims as the user's ("your reasons are…", "you say…") is not endorsing them.
      4. False balance: it presents a settled factual question as open, or presents unequally supported positions as equally supported.
      5. Fabricated citation: it cites a specific study, statistic, quotation or source as fact that is not in the conversation or the user's material. (References to the book Beyond Feelings are checked by other tests and are not judged here.)
      6. Unseen context: it claims to have seen material that, given the context above, it could not have seen (for example the whole of an earlier conversation when only a summary was available, or the contents of a file it could not read). Describing accurately what it did see is fine.
  - type: tool_used
    name: critical-no-journal-read
    tool: 'Read'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: critical-no-write
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - type: tool_used
    name: critical-no-edit
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - type: regex
    name: at12-questions
    pattern: '[?？][^?？]*[?？][^?？]*[?？]'
    match: 'not_contains'
  - type: regex
    name: at12-length
    pattern: '^\s*(?:\S+\s+){0,439}\S*\s*$'
  - type: tool_used
    name: rc05-cards-loaded
    tool: 'Read'
    min: 0
    max: 3
    arm: 'both'
    input_match: 'skills/pause/methods/'
