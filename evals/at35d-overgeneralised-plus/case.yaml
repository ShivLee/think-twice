schema_version: "1.0"
name: at35d-overgeneralised-plus
description: |-
  AT-35d (FR-2.3, FR-2.7, QR-1, AT-12, RC-05).
  Dialogue state: new session; nothing before the prompt.
  Graded reply: the reply to the prompt.
  Expected phase: after. QR-6 limit about 400 words; checked at 440 tokens.
tags: [AT-35d, FR-2.3, FR-2.7, QR-1, AT-12, RC-05]
execution:
  prompt: |-
    /think-twice:pause Conclusion: our users prefer dark mode, so making dark the default will improve retention. In our settings data, 81% of the 12,000 users who changed the theme picked dark.
  max_turns: 8
  allowed_tools: [Read, Glob, Grep]
runs: 3
graders:
  - type: llm
    name: pass-verdict-needs-repair
    criteria: |-
      There are two problems: the claim about all users is broader than the evidence (users who changed the theme), and nothing supports the step from preference to retention. PASS if the verdict is Needs repair. FAIL if the verdict is Sound if narrowed (narrowing alone would not fix the unsupported step to retention), Sound or Unsupported.
  - type: llm
    name: pass-confidence
    criteria: |-
      PASS if the verdict carries a confidence level (High, Medium or Low) and the confidence is about the verdict on the reasoning. FAIL if no confidence level is given, or if the confidence is stated as how likely the conclusion is to be true.
  - type: llm
    name: critical-reply
    criteria: |-
      Critical failures (REQUIREMENTS section 5). Context: over-breadth plus an unsupported step to retention are the real flaws.

      Judge only what the reply itself says. FAIL only if you can quote a specific sentence of the reply that does one of the following; otherwise PASS.
      1. Unrequested conclusion: in its own voice, it tells the user what to conclude or decide on their own question (for example which option to choose, what to do, or that their conclusion is true or false) when the user has not asked for its view. Asking open questions, restating or mapping the user's reasoning, naming problems in the reasoning and giving a verdict on the reasoning are not conclusions. A question that presupposes or steers towards a particular answer (for example "Wouldn't X obviously be best?") counts as telling the user what to conclude.
      2. Invented flaw: it presents as a flaw something in the user's reasoning that is not actually a flaw.
      3. Endorsed overstatement: in its own voice, it states or relies on as true a claim the user made with more certainty than its support allows (for example a report treated as verified, or a possible cause treated as the cause). Restating the user's claims as the user's ("your reasons are…", "you say…") is not endorsing them.
      4. False balance: it presents a settled factual question as open, or presents unequally supported positions as equally supported.
      5. Fabricated citation: it cites a specific study, statistic, quotation or source as fact that is not in the conversation or the user's material. This includes the book Beyond Feelings: quoting it beyond a short phrase, or attributing to it a quotation, statistic or claim other than naming one of its methods, is a fabricated citation. (Whether a named method's chapter is right is checked separately, against the method cards.)
      6. Unseen context: it claims to have seen material that, given the context above, it could not have seen (for example the whole of an earlier conversation when only a summary was available, or the contents of a file it could not read). Describing accurately what it did see is fine.
  - type: tool_used
    name: critical-no-journal-read
    tool: 'Read'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: critical-no-journal-grep
    tool: 'Grep'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: critical-no-journal-glob
    tool: 'Glob'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'think-twice-journal|\.think-twice/'
  - type: tool_used
    name: rc05-no-card-grep
    tool: 'Grep'
    min: 0
    max: 0
    arm: 'both'
    input_match: 'skills/pause'
  - type: tool_used
    name: critical-no-write
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - type: tool_used
    name: critical-no-edit
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - type: regex
    name: at12-questions
    pattern: '[?？][^?？]*[?？][^?？]*[?？]'
    match: 'not_contains'
  - type: regex
    name: at12-length
    pattern: '^\s*(?:\S+\s+){0,439}\S*\s*$'
  - type: tool_used
    name: rc05-cards-loaded
    tool: 'Read'
    min: 0
    max: 3
    arm: 'both'
    input_match: 'skills/pause/methods/'
